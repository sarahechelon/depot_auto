name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen --all-groups
      - name: Lint
        run: make lint
      - name: Test
        run: make test
